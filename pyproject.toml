[project]
name = "keras-book"
version = "0.1.0"
description = "Runnable code and checks for 'Keras 3: From First Layer to Production'"
requires-python = ">=3.11"
dependencies = [
    "keras>=3.15,<4",
    "tensorflow>=2.21",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

# TensorFlow is the backend the book runs on. Keras 3 also runs on JAX and PyTorch;
# Chapter 15 says exactly what was and was not tested there.
# The book needs no network at run time: every dataset is generated or ships with scikit-learn.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]
